name: Security Preflight

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  security-preflight:
    name: Static and release security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m venv Backend/venv
          Backend/venv/bin/python -m pip install --upgrade pip
          Backend/venv/bin/pip install -r Backend/requirements.txt

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate release scripts parse
        run: |
          node --check scripts/build-ait-release.js
          node --check scripts/release-security-check.js
          node --check scripts/live-security-audit.js

      - name: Static security tests
        run: |
          Backend/venv/bin/pytest \
            Backend/tests/test_frontend_security_static.py \
            Backend/tests/test_supabase_security_static.py \
            -q

      - name: Backend security regression tests
        run: |
          Backend/venv/bin/pytest \
            Backend/tests/test_security.py \
            Backend/tests/test_log_redaction.py \
            Backend/tests/test_org_security.py \
            Backend/tests/test_coaching_security.py \
            Backend/tests/test_report_service.py \
            Backend/tests/test_referral_security.py \
            Backend/tests/test_subscription_security.py \
            Backend/tests/test_subscription_entitlements.py \
            Backend/tests/test_log_security.py \
            Backend/tests/test_dashboard_service.py \
            -q

      - name: Edge security tests
        run: npm run test:edge

      - name: Release artifact security scan
        run: |
          if [ -f taillog-app.ait ]; then
            npm run release:security-check
          else
            echo "taillog-app.ait is not checked in; npm run build enforces the release artifact scan before upload."
          fi
