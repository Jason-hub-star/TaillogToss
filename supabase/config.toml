# Supabase Edge Functions config — Phase 11 + REG contracts
# verify_jwt=false:
# - login-with-toss: public OAuth bridge, verifies Toss authCode via mTLS
# - verify-iap-order / assign-b2b-role / withdraw-user: internal /auth/v1/user verification
# - toss-disconnect: Basic Auth callback
# - legal: public legal documents

[functions.login-with-toss]
enabled = true
verify_jwt = false
entrypoint = "./functions/login-with-toss/main.ts"

[functions.verify-iap-order]
enabled = true
verify_jwt = false
entrypoint = "./functions/verify-iap-order/main.ts"

